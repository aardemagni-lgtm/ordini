:root{color-scheme:dark;--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--mut:#9aa3b2;--line:#2c323c;--acc:#4cc9a0;--acc2:#16322a;--ko:#ff8a80;--ko2:#3a1e1c;--warn:#ffb74d;--warn2:#3a2c15}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Rubik',system-ui,Segoe UI,Roboto,sans-serif}
*,button{font-family:'Rubik',system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{height:40px;width:auto;border-radius:8px;display:block}
.appname{font-weight:600;font-size:17px}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.top{margin-bottom:12px}.ttl{font-size:24px;font-weight:600}.sub{color:var(--mut);font-size:13px}
button{font:inherit;border:1px solid #B4E61E;background:#B4E61E;color:#000;padding:12px 22px;border-radius:8px;cursor:pointer;text-transform:lowercase;font-weight:600;width:100%;margin-top:14px}
button:active{background:#c6f03c}
button[hidden]{display:none}
button.sec{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:400}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .l{color:var(--mut);font-size:12px}.stat .v{font-size:28px;font-weight:600;line-height:1.2}.stat .v small{font-size:15px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
h2{font-size:16px;margin:20px 0 10px}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--acc2);color:var(--acc)}.b.ko{background:var(--ko2);color:var(--ko)}.b.w{background:var(--warn2);color:var(--warn)}.b.g{background:var(--line);color:var(--mut)}
.ban{padding:12px 16px;border-radius:10px;margin-bottom:12px;background:var(--warn2);color:var(--warn);font-size:14px}.ban.ko{background:var(--ko2);color:var(--ko)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.fcard{padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--card)}
.fnow{color:#B4E61E;font-size:20px;font-weight:600;margin:2px 0}
.mut{color:var(--mut)}.ko{color:var(--ko)}
table{border-collapse:collapse;width:100%}td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}td.n{text-align:right;font-weight:600;white-space:nowrap;padding-right:0}
tr.tot td{font-weight:700;border-bottom:0}
h3{font-size:13px;color:var(--mut);margin:16px 0 6px;font-weight:600}
details.od>summary{list-style:none;cursor:pointer}details.od>summary::-webkit-details-marker{display:none}
details.od>summary::after{content:'▸ dettagli';display:block;color:var(--mut);font-size:12px;margin-top:6px}details.od[open]>summary::after{content:'▾ nascondi'}
.dt{border-top:1px solid var(--line);margin-top:10px}
.ck{font-size:13px;margin:3px 0}.ck.ko{color:var(--ko)}.ck.ok{color:var(--acc)}.ck .mut{font-size:12px;margin-left:14px}
details.sub2{margin-top:8px}details.sub2>summary{color:var(--mut);font-size:12px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:22px 0}
input[type=file]{display:none}

<main>
  <div class="top"><div class="ttl">Questa settimana</div><div class="sub" id="agg">Nessun dato caricato</div></div>
  <div id="stale"></div>
  <div id="out"><div class="card empty">Premi "carica stato" e scegli <b>stato_mobile.json</b> dalla cartella OneDrive dell'app.</div></div>
  <button id="od" hidden>aggiorna da OneDrive</button>

</main>
<script>
// ---- Configurazione OneDrive (vedi GUIDA_ONLINE.md). Lasciando CLIENT_ID vuoto la pagina funziona solo con il file a mano.
const CLIENT_ID = "";                                   // ID applicazione (client) registrato in Microsoft Entra
const FILE_PATH = "OrdiniEsselunga/stato_mobile.json";  // percorso del file dentro OneDrive
// -----------------------------------------------------------------------------------------------------------
const $=id=>document.getElementById(id), KEY="oe_stato";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||"");return m?`${m[3]}/${m[2]}/${m[1]}`:(s||"—")};
function render(d){
  $("agg").textContent="aggiornato dal PC: "+(d.aggiornato||"—").replace(/^(\d{4})-(\d\d)-(\d\d)/,"$3/$2/$1");
  const ore=(Date.now()-new Date((d.aggiornato||"").replace(" ","T")))/36e5;
  $("stale").innerHTML=ore>24?`<div class="ban">Dati vecchi di ${Math.floor(ore/24)||1} giorno/i: ricarica il file aggiornato.</div>`:"";
  const ctrl=!d.generato?'<span class="b w">da generare</span>':d.controlli_ok===false?'<span class="b ko">da controllare</span>':'<span class="b ok">ok</span>';
  let h=`<div class="stats">
   <div class="stat"><div class="l">ordini confermati</div><div class="v">${d.confermati} <small>/ ${d.ordini.length}</small></div></div>
   <div class="stat"><div class="l">colli totali</div><div class="v">${d.confermati?d.colli_totali:"—"}</div></div>
   <div class="stat"><div class="l">consegna</div><div class="v" style="font-size:19px;padding-top:6px">${esc(d.consegna||"—")}</div></div>
   <div class="stat"><div class="l">controlli</div><div style="margin-top:8px">${ctrl}</div></div></div>`;
  if(d.fornitore)h+=`<div class="fcard"><div class="mut" style="font-size:12px">Fornitore di questa settimana</div><div class="fnow">${esc(d.fornitore)}</div></div>`;
  (d.avvisi||[]).forEach(a=>h+=`<div class="ban">${esc(a)}</div>`);
  if((d.destinazioni||[]).length){
    h+="<h2>Totali per destinazione</h2>"+d.destinazioni.map(x=>`<div class="card"><div class="row"><b style="font-size:18px">${esc(x.destinazione)}</b>
      <span><b style="font-size:22px">${x.colli}</b> <span class="mut">colli</span></span></div>
      <div class="mut" style="font-size:13px">${x.ordini} ${x.ordini===1?"ordine":"ordini"} · ${x.negozi} negozi</div>
      ${(x.fuori_modello||[]).length?`<div class="mut" style="font-size:12px;margin-top:6px">Fuori modello: ${x.fuori_modello.map(f=>esc(f.codice)+" ("+f.colli+")").join(", ")}</div>`:""}</div>`).join("");
  }
  if((d.fuori_modello||[]).length){
    h+="<h2>Articoli fuori modello</h2><div class=\"card\"><table>"+d.fuori_modello.map(f=>`<tr><td><b>${esc(f.codice)}</b><div class="mut" style="font-size:12px">${esc(f.desc)}</div></td><td class="n">${f.colli}</td></tr>`).join("")+"</table></div>";
  }
  if((d.pesi||[]).length)h+=`<div class="mut" style="font-size:12px;margin:6px 2px">${d.pesi.map(esc).join("<br>")}</div>`;
  h+="<h2>Ordini</h2>";
  h+=d.ordini.length?d.ordini.map(o=>{
    const t=o.fase&&o.fase!=="pronto"?(o.fase==="errore"?'<span class="b ko">errore</span>':'<span class="b w">in lettura</span>')
      :o.confermato?'<span class="b ok">confermato</span>':'<span class="b w">da controllare</span>';
    const ko=(o.controlli||[]).filter(c=>!c.ok), okn=(o.controlli||[]).length-ko.length;
    const dett=`<div class="dt">
      <h3>Colli per negozio (${(o.negozi_dett||[]).length})</h3><table>${(o.negozi_dett||[]).map(s=>`<tr><td class="mut">${esc(s.codice)}</td><td><b>${esc(s.sigla||"")}</b> ${esc(s.nome||"")}</td><td class="n">${s.colli??"—"}</td></tr>`).join("")}
        <tr class="tot"><td></td><td>Totale</td><td class="n">${o.colli??"—"}</td></tr></table>
      <h3>Articoli (${(o.articoli||[]).length})</h3><table>${(o.articoli||[]).map(a=>`<tr><td class="mut">${esc(a.codice)}</td><td>${esc(a.desc||"")}</td><td class="n">${a.colli??"—"}</td></tr>`).join("")}</table>
      <h3>Controlli</h3>${ko.length?ko.map(c=>`<div class="ck ko">✗ ${esc(c.nome)}<div class="mut">${esc(c.dettaglio||"")}</div></div>`).join(""):""}
      <div class="ck ok">✓ ${okn} controlli superati${o.edi==="ok"?" (coerenza EDI ok)":""}</div>
      <details class="sub2"><summary>mostra tutti i controlli</summary>${(o.controlli||[]).map(c=>`<div class="ck ${c.ok?"":"ko"}">${c.ok?"✓":"✗"} ${esc(c.nome)}<div class="mut">${esc(c.dettaglio||"")}</div></div>`).join("")}</details></div>`;
    return `<details class="card od"><summary><div class="row"><b>${esc(o.numero||"—")}</b>${t}</div>
      <div class="mut" style="font-size:13px">${esc(o.destinazione||"?")} · ${o.negozi??0} negozi · ${o.colli??"—"} colli${o.data_ordine?` · ordine del ${esc(o.data_ordine)}`:""}${o.ko?` · <span class="ko">${o.ko} controlli KO</span>`:""}</div></summary>${dett}</details>`;
  }).join(""):'<div class="card empty">Nessun ordine caricato.</div>';
  h+="<h2>Archivio</h2>";
  h+=(d.archivio||[]).length?d.archivio.map(w=>`<div class="card"><div class="row"><b>${dt(w.consegna)}</b>
    <span class="b ${w.controlli_ok?"ok":"ko"}">${w.controlli_ok?"ok":"da controllare"}</span></div>
    <div class="mut" style="font-size:13px">${(w.ordini||[]).length} ordini · ${w.colli??"—"} colli${w.fornitore?" · "+esc(w.fornitore):""}</div></div>`).join(""):'<div class="card empty">Archivio vuoto.</div>';
  $("out").innerHTML=h;
}
function mostra(txt,salva){
  try{const d=JSON.parse(txt);if(!Array.isArray(d.ordini))throw 0;render(d);
    if(salva)try{localStorage.setItem(KEY,txt)}catch(e){}return true}
  catch(e){$("out").innerHTML='<div class="card empty">File non valido: scegli stato_mobile.json.</div>';return false}
}
$("b").onclick=()=>$("f").click();
$("f").onchange=async e=>{const f=e.target.files[0];if(f)mostra(await f.text(),true);e.target.value=""};
try{const s=localStorage.getItem(KEY);if(s)mostra(s,false)}catch(e){}

const SCOPES=["Files.Read"];let pca=null;
function carica(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("script non caricato"));document.head.appendChild(s)})}
async function oneDrive(interattivo){
  const msg=$("msg");
  try{
    if(!pca){
      await carica("https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.39.0/lib/msal-browser.min.js");
      pca=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
      await pca.handleRedirectPromise();
    }
    const acc=pca.getAllAccounts()[0];
    if(!acc){if(interattivo)await pca.loginRedirect({scopes:SCOPES});return}
    let tk;
    try{tk=(await pca.acquireTokenSilent({scopes:SCOPES,account:acc})).accessToken}
    catch(e){if(interattivo)await pca.acquireTokenRedirect({scopes:SCOPES});return}
    msg.textContent="Aggiorno da OneDrive…";
    const r=await fetch("https://graph.microsoft.com/v1.0/me/drive/root:/"+FILE_PATH.split("/").map(encodeURIComponent).join("/")+":/content",{headers:{Authorization:"Bearer "+tk}});
    if(!r.ok)throw new Error(r.status===404?"file non trovato in OneDrive ("+FILE_PATH+")":"errore "+r.status);
    mostra(await r.text(),true);msg.textContent="";
  }catch(e){msg.textContent="OneDrive: "+e.message+" — puoi caricare il file a mano."}
}
if(CLIENT_ID){$("od").hidden=false;$("od").onclick=()=>oneDrive(true);oneDrive(false)}
</script>
